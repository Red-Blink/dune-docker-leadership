<!doctype html>
<html lang="en" data-addon-id="leadership-board-demo">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leadership Board Demo</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="toolbar">
        <div>
          <h1>Leadership Board Demo</h1>
          <p class="subtitle">Demo read-only addon for a ranked player overview from this Dune Docker server.</p>
        </div>
        <div class="toolbar-actions">
          <label class="search">
            <span>Search</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="Player, faction, guild, map">
          </label>
          <button id="refreshButton" type="button">Refresh</button>
        </div>
      </header>

      <section class="summary" aria-label="Leadership summary">
        <div class="metric">
          <span class="metric-label">Players</span>
          <strong id="playerCount">0</strong>
        </div>
        <div class="metric">
          <span class="metric-label">Online</span>
          <strong id="onlineCount">0</strong>
        </div>
        <div class="metric">
          <span class="metric-label">Highest Level</span>
          <strong id="highestLevel">0</strong>
        </div>
      </section>

      <section class="table-panel">
        <div id="status" class="status">Loading leadership data...</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>Level</th>
                <th>Faction</th>
                <th>Guild</th>
                <th>Status</th>
                <th>Map</th>
                <th>Last Seen</th>
              </tr>
            </thead>
            <tbody id="leaderRows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="./dune-addon-bridge.js"></script>
    <script src="./addon.js"></script>
  </body>
</html>
